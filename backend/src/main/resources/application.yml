spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/preploop}
    username: ${DB_USER:preploop}
    password: ${DB_PASSWORD:preploop}
  jpa:
    hibernate:
      ddl-auto: validate      # schema is owned by Flyway
    open-in-view: false
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

server:
  port: ${PORT:8080}

app:
  jwt-secret: ${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
  access-token-minutes: 15
  refresh-token-days: 7
  admin-email: ${ADMIN_EMAIL:me@example.com}
  admin-password: ${ADMIN_PASSWORD:change-me}
  cors-origin: ${CORS_ORIGIN:http://localhost:4200}
  llm:
    provider: gemini
    api-key: ${GEMINI_API_KEY:}
    daily-import-cap: 20
